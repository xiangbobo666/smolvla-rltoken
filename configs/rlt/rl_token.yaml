# Stage 1 RL Token (Eq. 1–2). Defaults match RLTokenConfig.
# Loss is masked mean-MSE over tokens (not paper sum_i); scale is absorbed by lr.

vla_width: 960
d_model: 512
n_heads: 8
n_encoder_layers: 2
n_decoder_layers: 2
mlp_ratio: 4.0
dropout: 0.0
use_image_tokens_only: true
max_recon_tokens: 256
lr: 1.0e-4
weight_decay: 0.01
grad_clip_norm: 1.0
steps: 5000
batch_size: 16
