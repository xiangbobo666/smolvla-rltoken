# SmolVLA SFT on PegInsertionSide-v1 (motion-planning, pd_joint_pos).
# Consumed by scripts/train_sft.py, which execs lerobot-train.
# CPU-only: python scripts/train_sft.py --check
# GPU smoke (2 steps, throwaway dir): python scripts/train_sft.py --smoke
#
# Dataset cameras are environment_camera + hand_camera + insertion_camera.
# smolvla_base expects observation.images.camera{1,2,3}; train_sft.py
# passes the corresponding rename_map.

policy_path: /root/autodl-tmp/smolvla-rltoken/models/lerobot/smolvla_base
dataset_repo_id: wkal/smolvla-rlt
dataset_root: /root/autodl-tmp/smolvla-rltoken/data/lerobot/PegInsertionSide-v1/motionplanning_rgb_pd_joint_pos
output_dir: /root/autodl-tmp/smolvla-rltoken/outputs/sft/peg_insertion
job_name: smolvla_sft_peg_insertion

batch_size: 32
steps: 20000
save_freq: 5000
log_freq: 200
num_workers: 16
eval_freq: 0
seed: 1000
device: cuda
# torchcodec 0.7 matches torch 2.8. pyav is LeRobot's fallback if torchcodec cannot load.
video_backend: torchcodec

freeze_vision_encoder: true
train_expert_only: true
train_state_proj: true
push_to_hub: false
wandb_enable: true
wandb_project: smolvla-rltoken
wandb_disable_artifact: false

rename_map:
  observation.images.environment_camera: observation.images.camera1
  observation.images.hand_camera: observation.images.camera2
  observation.images.insertion_camera: observation.images.camera3
