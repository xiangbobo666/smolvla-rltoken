      - YAML 路径改为相对仓库根目录，启动器自动探测 Conda、移除失效旧代理；删除空骨架文件。
      - 从 Hugging Face 下载 `lerobot/smolvla_base` 与三相机数据集 `wkal/smolvla-rlt`。
      - 接入实验记录站：Stage 1 / Stage 2 训练与 SFT 评测直接写 `metrics.jsonl`、`eval.jsonl`、`tables.json`，
        SFT 训练曲线用 `scripts/export_site_metrics.py` 从 lerobot 日志转换；指标定义在 `docs/site/schemas/`。
