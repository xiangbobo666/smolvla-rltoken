title: SmolVLA + RL Token · PegInsertionSide 强化学习实验记录
subtitle: SmolVLA SFT · RL Token 表征 · chunk 级残差 Actor-Critic · ManiSkill PegInsertionSide-v1 · 仅仿真
intro: |
  在仿真里复现 RL Token（RLT）：先在 PegInsertion 演示上对 SmolVLA 做 SFT，再把冻结 VLA 的 prefix hidden 压缩成一个 RL Token，
  最后以冻结 VLA 给出的 reference chunk 为条件，在线训练一个 chunk 级 Actor-Critic，修正 VLA 在精细插入阶段的动作。

  - **Stage 0 SFT**：`smolvla_base` 在 1000 条 motion-planning 演示（149,055 帧，三相机 512²）上训练 20k 步；VLM 冻结（`train_expert_only`）。
  - **Stage 1 RL Token**：冻结 SFT VLM 的 prefix hidden `[B, M≈192, 960]` → encoder → `z_rl ∈ R^512`，causal decoder 做 teacher-forcing 重建（`loss_ro`）。
  - **Stage 2 Online RL**：`x = [z_rl, proprio(9)]`，`ã` = 冻结 VLA chunk 的前 C=10 步；残差 Actor `a = ã + Δ`（末层零初始化），twin Q，稀疏 `info["success"]`，chunk 级 n-step TD。
  - **评估口径**：ManiSkill `info.success`；固定 seeds（SFT 用 10000–10099），每局最多 200 步，汇报 Wilson 95% 区间。每次评测在 `benchamrk/<stage>/` 写 Markdown 记录（目录名沿用这个拼写）。
  - 结论标签只覆盖对应记录里明确列出的项目。2026-09 的阶段是旧 AutoDL 实例上的结果，原始输出已丢失，数字取自 `benchamrk/` 与 `docs/online-rl/stage2_survey.md` §13。

runs: {}
