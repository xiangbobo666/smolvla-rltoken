      - [3D 回放查看器接入方案, site/viewer3d.md]

lessons:
  - title: 交接时 Actor 必须逐位等于参考策略
    body: |
      非残差 Actor 要在几千次梯度里重新学会 SFT 策略，交接时每个关节偏 2–4 度，毫米级插入直接崩溃。残差 + 末层零初始化让 step 0 的 Actor 恒等于冻结 VLA，
      再用 `handover_bc_threshold` 作为回归护栏。
    evidence: [stage2-handover, stage2-bc-pinned]
  - title: β 决定 Actor 偏离多远，先读梯度再调
    body: |
      BC 稳定点是 `μ − ref = (dQ/dμ) / (2β)`。两次 run 的 ‖∂Q/∂μ‖ 几乎相同，Δ 的差异全部来自 β。调 β 之前先看 `grad_ratio`、`q_adv_det`；
      Critic 对动作没有可信意见时，调小 β 只会放大噪声。
    evidence: [stage2-bc-pinned, stage2-critic-blind]
  - title: Critic 输入要让动作扰动成为 O(1) 信号
    body: |
      动作绝对值 O(1)–O(5)、探索扰动只有 0.02，拼进 521 维状态后被 LayerNorm 淹没，Q 只靠 V(x) 就能把 TD loss 压低。
      `q_gap` 衡量的是状态区分度，不是动作敏感度。改为残差坐标 `(a − ã)/scale` 输入。
    evidence: [stage2-critic-blind]
  - title: 训练内 16 局探针判不了提升
    body: |
      n=16 的 95% CI 约 [2%, 38%]；10.6% 对 15.1% 只有 1.7σ。是否有提升以固定 seeds 的正式评测（Wilson CI）为准，配对探针只作趋势参考。
    evidence: [stage2-bc-pinned, stage2-critic-blind]
  - title: 稀疏奖励下不要清零未执行的动作尾巴
    body: |
      成功发生在 chunk 中段时，剩余步的动作被写成 0 存进 replay，而这些恰好是唯一的高价值转移，Critic 学到「零动作 = 高 Q」。只清零奖励尾巴，动作保留原值。
    evidence: [stage2-handover]
